version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: ds_engineering_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SQL_DB_NAME:-ds_engineering}
      POSTGRES_USER: ${SQL_USER:-ds_admin}
      POSTGRES_PASSWORD: ${SQL_PASSWORD:-ds_password123}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SQL_USER:-ds_admin} -d ${SQL_DB_NAME:-ds_engineering}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
