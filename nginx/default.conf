# Редирект с HTTP на HTTPS
server {
    listen 80;
    server_name ds-engineering.ru www.ds-engineering.ru;

    # Для проверки домена Let's Encrypt / Reg.ru (если требуется)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Основной защищенный HTTPS сервер (TLS от REG.RU)
server {
    listen 443 ssl http2;
    server_name ds-engineering.ru www.ds-engineering.ru;

    # Пути к файлам сертификата от REG.RU:
    # 1. fullchain.crt (или bundle/ваш_домен.crt + ca_bundle.crt)
    # 2. private.key (приватный ключ, сгенерированный при заказе CSR)
    ssl_certificate /etc/nginx/ssl/fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/private.key;

    # Современные и безопасные протоколы и шифры
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Сжатие Gzip для максимального ускорения отдачи фронтенда
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Кэширование статичных ассетов (JS-чанки, CSS, WebGL, шрифты)
    location ~* \.(?:css|js|woff2?|eot|ttf|otf|svg|png|jpg|jpeg|webp|ico|glb|step|stp)$ {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
        
        # Лимит на загрузку тяжелых 3D-моделей и файлов до 10 ГБ
        client_max_body_size 10240M;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

